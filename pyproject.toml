[project]
name = "localflow-core"
version = "0.3.0"
description = "Motor multi-tenant para captación y automatización por WhatsApp"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3",
]

[tool.ruff]
line-length = 100


[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
