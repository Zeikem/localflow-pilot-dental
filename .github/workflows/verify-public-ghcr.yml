name: verify-public-ghcr

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Anonymous pull
        run: docker pull ghcr.io/zeikem/localflow-pilot-dental:railway
      - name: Verify startup files
        run: |
          docker run --rm --entrypoint sh ghcr.io/zeikem/localflow-pilot-dental:railway -lc 'test -x /app/bin/start-api && python --version && python -c "import app; print(\"app-import-ok\")"'
      - name: Verify public API health
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 2 https://api-image-production-7f8d.up.railway.app/health
