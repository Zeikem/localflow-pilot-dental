name: publish-railway-image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t ttl.sh/localflow-pilot-dental-28b2820:24h .
      - name: Push temporary OCI image
        run: docker push ttl.sh/localflow-pilot-dental-28b2820:24h
