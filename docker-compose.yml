services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: impulvera
      POSTGRES_USER: impulvera
      POSTGRES_PASSWORD: impulvera
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impulvera -d impulvera"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.workers.outbox"]

  calendar-worker:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.workers.calendar_sync"]

volumes:
  pgdata:
